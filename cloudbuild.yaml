# Push to main → deploy gen2 HTTP function `elead`.
# Set substitutions on the Cloud Build trigger:
#   _REGION, _FUNCTION_NAME, and secret PRIVATE_KEY (Secret Manager).
substitutions:
  _REGION: europe-west1
  _FUNCTION_NAME: elead
  _RUNTIME: nodejs20
  _MEMORY: 1024MB
  _TIMEOUT: 540s

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - ${_FUNCTION_NAME}
      - --gen2
      - --runtime=${_RUNTIME}
      - --region=${_REGION}
      - --source=.
      - --entry-point=elead
      - --trigger-http
      - --allow-unauthenticated
      - --memory=${_MEMORY}
      - --timeout=${_TIMEOUT}
      - --set-env-vars=CHAIN_ID=11155111,URL_RPC=https://sepolia.drpc.org,PUBLIC_BASE_URL=${_PUBLIC_BASE_URL},ELEAD_HTML_URL=https://cellact.github.io/Elead-HTML/,CLAIM_PROVIDER=Elead
      - --set-secrets=PRIVATE_KEY=elead-private-key:latest

options:
  logging: CLOUD_LOGGING_ONLY
